name: Promote existing T2 release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing T2 release tag to promote"
        required: true
        type: string

permissions:
  contents: write

jobs:
  promote:
    name: Validate and promote existing release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Inspect release
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail

          echo "Inspecting release:"
          echo "${RELEASE_TAG}"

          RELEASE_JSON="$(
            gh api \
              "repos/${GH_REPO}/releases/tags/${RELEASE_TAG}"
          )"

          RELEASE_ID="$(
            jq -r '.id // empty' \
              <<< "${RELEASE_JSON}"
          )"

          RELEASE_NAME="$(
            jq -r '.name // empty' \
              <<< "${RELEASE_JSON}"
          )"

          DRAFT="$(
            jq -r '.draft' \
              <<< "${RELEASE_JSON}"
          )"

          PRERELEASE="$(
            jq -r '.prerelease' \
              <<< "${RELEASE_JSON}"
          )"

          URL="$(
            jq -r '.html_url // empty' \
              <<< "${RELEASE_JSON}"
          )"

          if [[ -z "${RELEASE_ID}" ]]; then
            echo "ERROR: release ID is empty"
            exit 1
          fi

          KERNEL_COUNT="$(
            jq '
              [
                .assets[] |
                select(
                  .state == "uploaded" and
                  (.name | test(
                    "^proxmox-kernel-.*-pve-t2_.*_amd64\\.deb$"
                  ))
                )
              ] |
              length
            ' <<< "${RELEASE_JSON}"
          )"

          HEADER_COUNT="$(
            jq '
              [
                .assets[] |
                select(
                  .state == "uploaded" and
                  (.name | test(
                    "^proxmox-headers-.*-pve-t2_.*_amd64\\.deb$"
                  ))
                )
              ] |
              length
            ' <<< "${RELEASE_JSON}"
          )"

          SUM_COUNT="$(
            jq '
              [
                .assets[] |
                select(
                  .state == "uploaded" and
                  .name == "SHA256SUMS"
                )
              ] |
              length
            ' <<< "${RELEASE_JSON}"
          )"

          TOTAL_ASSETS="$(
            jq '.assets | length' \
              <<< "${RELEASE_JSON}"
          )"

          if [[ "${KERNEL_COUNT}" -ne 1 ]]; then
            echo "ERROR: expected exactly one kernel package"
            exit 1
          fi

          if [[ "${HEADER_COUNT}" -ne 1 ]]; then
            echo "ERROR: expected exactly one headers package"
            exit 1
          fi

          if [[ "${SUM_COUNT}" -ne 1 ]]; then
            echo "ERROR: expected exactly one SHA256SUMS file"
            exit 1
          fi

          if [[ "${TOTAL_ASSETS}" -ne 3 ]]; then
            echo "ERROR: expected exactly three release assets"
            echo "Found: ${TOTAL_ASSETS}"
            exit 1
          fi

          echo
          echo "Release validated."
          echo "ID:         ${RELEASE_ID}"
          echo "Name:       ${RELEASE_NAME}"
          echo "Draft:      ${DRAFT}"
          echo "Prerelease: ${PRERELEASE}"
          echo "URL:        ${URL}"

          {
            echo "id=${RELEASE_ID}"
            echo "name=${RELEASE_NAME}"
            echo "url=${URL}"
            echo "draft=${DRAFT}"
            echo "prerelease=${PRERELEASE}"
          } >> "${GITHUB_OUTPUT}"

      - name: Promote to stable Latest release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_ID: ${{ steps.release.outputs.id }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail

          echo "Promoting:"
          echo "${RELEASE_TAG}"

          gh api \
            --method PATCH \
            "repos/${GH_REPO}/releases/${RELEASE_ID}" \
            -F draft=false \
            -F prerelease=false \
            -f make_latest=true \
            > promoted-release.json

          DRAFT="$(
            jq -r '.draft' \
              promoted-release.json
          )"

          PRERELEASE="$(
            jq -r '.prerelease' \
              promoted-release.json
          )"

          if [[ "${DRAFT}" != false ]]; then
            echo "ERROR: release is still a draft"
            exit 1
          fi

          if [[ "${PRERELEASE}" != false ]]; then
            echo "ERROR: release is still marked as prerelease"
            exit 1
          fi

          LATEST_ID="$(
            gh api \
              "repos/${GH_REPO}/releases/latest" \
              --jq '.id'
          )"

          if [[ "${LATEST_ID}" != "${RELEASE_ID}" ]]; then
            echo "ERROR: GitHub Latest does not point to this release"
            echo "Expected ID: ${RELEASE_ID}"
            echo "Latest ID:   ${LATEST_ID}"
            exit 1
          fi

          echo
          echo "Release successfully promoted to stable Latest."

      - name: Write summary
        if: always()
        shell: bash
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF_SUMMARY
          # T2 release promotion

          - Tag: \`${{ inputs.tag }}\`
          - Release: \`${{ steps.release.outputs.name }}\`
          - Previous draft state: \`${{ steps.release.outputs.draft }}\`
          - Previous prerelease state: \`${{ steps.release.outputs.prerelease }}\`
          - Target state: **stable Latest release**

          No kernel compilation was performed by this workflow.
          EOF_SUMMARY