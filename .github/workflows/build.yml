name: Build T2 kernel

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

concurrency:
  group: t2-kernel-build-and-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  discover:
    name: Discover and build changed upstream revisions
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    outputs:
      changed: ${{ steps.pve.outputs.status == 'resolved' && steps.candidate.outputs.changed == 'true' && 'true' || 'false' }}
      promote: ${{ steps.candidate.outputs.promote }}
      release_id: ${{ steps.candidate.outputs.release_id }}
      tag: ${{ steps.candidate.outputs.tag }}
      kernel: ${{ steps.pve_repo.outputs.kernel }}
      pve_sha: ${{ steps.pve.outputs.sha }}
      t2_sha: ${{ steps.t2.outputs.sha }}
      t2_patchset_sha: ${{ steps.t2.outputs.patchset_sha }}
      source_status: ${{ steps.pve.outputs.status }}
      t2_review_count: ${{ steps.t2.outputs.review_count }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Discover latest published Proxmox kernel
        id: pve_repo
        shell: bash
        run: |
          bash scripts/discover-proxmox.sh

      - name: Resolve published Proxmox source commit
        id: pve
        shell: bash
        env:
          PUBLISHED_KERNEL: ${{ steps.pve_repo.outputs.kernel }}
          PUBLISHED_VERSION: ${{ steps.pve_repo.outputs.version }}
        run: |
          bash scripts/resolve-proxmox.sh

      - name: Skip build while Proxmox source is pending
        if: steps.pve.outputs.status == 'pending'
        shell: bash
        env:
          PACKAGE_VERSION: ${{ steps.pve_repo.outputs.version }}
        run: |
          echo "::notice title=Proxmox source pending::${PACKAGE_VERSION} is published in APT, but the matching Git source is not available yet. T2 build skipped; the scheduled workflow will retry later."

      - name: Resolve Macmini8,1 T2 patch candidate
        if: steps.pve.outputs.status == 'resolved'
        id: t2
        shell: bash
        env:
          PVE_KERNEL: ${{ steps.pve_repo.outputs.kernel }}
        run: |
          bash scripts/resolve-t2.sh

      - name: Check whether this Macmini8,1 build is already published
        if: steps.pve.outputs.status == 'resolved'
        id: candidate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PVE_SHA: ${{ steps.pve.outputs.sha }}
          T2_PATCHSET_SHA: ${{ steps.t2.outputs.patchset_sha }}
          KERNEL_VERSION: ${{ steps.pve_repo.outputs.kernel }}
          PACKAGE_VERSION: ${{ steps.pve_repo.outputs.version }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          import urllib.error
          import urllib.request

          e = os.environ

          recipe = subprocess.check_output([
              'git',
              'rev-parse',
              'HEAD:scripts',
              'HEAD:.github/workflows/build.yml'
          ]).decode()

          identity = '\n'.join([
              e['PVE_SHA'],
              e['T2_PATCHSET_SHA'],
              e['PACKAGE_VERSION'],
              recipe
          ])

          digest = hashlib.sha256(
              identity.encode()
          ).hexdigest()

          preferred_tag = (
              f"auto-{e['KERNEL_VERSION']}-pve-t2-{digest}"
          )

          api = (
              f"https://api.github.com/repos/"
              f"{e['GITHUB_REPOSITORY']}"
          )

          headers = {
              'Authorization':
                  'Bearer ' + e['GH_TOKEN'],
              'Accept':
                  'application/vnd.github+json',
              'X-GitHub-Api-Version':
                  '2022-11-28'
          }

          def request_json(url):
              request = urllib.request.Request(
                  url,
                  headers=headers
              )

              with urllib.request.urlopen(
                  request,
                  timeout=60
              ) as response:
                  return json.load(response)

          #
          # Determine the release currently exposed by GitHub
          # as the repository Latest release.
          #

          latest_release_id = ''

          try:
              latest_release = request_json(
                  f"{api}/releases/latest"
              )

              latest_release_id = str(
                  latest_release['id']
              )

          except urllib.error.HTTPError as error:
              if error.code != 404:
                  raise

          changed = False
          promote = False
          release_id = ''
          selected_tag = preferred_tag
          exact_release = None

          #
          # First look for the exact release identity generated
          # by the current workflow.
          #

          try:
              exact_release = request_json(
                  f"{api}/releases/tags/{preferred_tag}"
              )

          except urllib.error.HTTPError as error:
              if error.code != 404:
                  raise

          if exact_release is not None:

              release_id = str(
                  exact_release['id']
              )

              if exact_release.get(
                  'draft',
                  False
              ):
                  #
                  # Incomplete draft.
                  #
                  # Rebuild/finish publication.
                  #
                  changed = True

              elif exact_release.get(
                  'prerelease',
                  False
              ):
                  #
                  # Exact validated build already exists but is
                  # still using the legacy prerelease state.
                  #
                  # Do not rebuild.
                  #
                  changed = False
                  promote = True

              else:
                  #
                  # Exact stable release already exists.
                  #
                  changed = False

                  #
                  # Repair GitHub's Latest pointer if required.
                  #
                  if (
                      latest_release_id
                      != release_id
                  ):
                      promote = True

          else:
              #
              # Compatibility with releases generated by older
              # versions of build.yml.
              #
              # Their tag digest may differ because build.yml is
              # part of the recipe fingerprint.
              #
              # Search for an already validated release with the
              # same actual kernel inputs:
              #
              #   - same Proxmox kernel version
              #   - same Proxmox source SHA
              #   - same Macmini8,1 T2 patchset SHA
              #
              # Search BOTH prereleases and stable releases.
              #

              releases = request_json(
                  f"{api}/releases?per_page=100"
              )

              pve_marker = (
                  f"Proxmox source: "
                  f"{e['PVE_SHA']}"
              )

              patchset_marker = (
                  "Macmini8,1 T2 patchset SHA256: "
                  f"{e['T2_PATCHSET_SHA']}"
              )

              kernel_marker = (
                  f"auto-"
                  f"{e['KERNEL_VERSION']}"
                  f"-pve-t2-"
              )

              matching_release = None

              for release in releases:

                  #
                  # Drafts are incomplete and cannot be used as
                  # proof of an already-published validated build.
                  #
                  if release.get(
                      'draft',
                      False
                  ):
                      continue

                  if not release.get(
                      'tag_name',
                      ''
                  ).startswith(
                      kernel_marker
                  ):
                      continue

                  body = (
                      release.get('body')
                      or ''
                  )

                  if pve_marker not in body:
                      continue

                  if patchset_marker not in body:
                      continue

                  matching_release = release
                  break

              if matching_release is not None:

                  selected_tag = (
                      matching_release[
                          'tag_name'
                      ]
                  )

                  release_id = str(
                      matching_release[
                          'id'
                      ]
                  )

                  changed = False

                  #
                  # Promotion/repair is required when:
                  #
                  #   - this is still a prerelease
                  #   - OR the stable release is not currently Latest
                  #
                  if (
                      matching_release.get(
                          'prerelease',
                          False
                      )
                      or
                      latest_release_id
                      != release_id
                  ):
                      promote = True

              else:
                  #
                  # No equivalent validated kernel exists.
                  #
                  # A real build is required.
                  #
                  changed = True

          with open(
              e['GITHUB_OUTPUT'],
              'a'
          ) as output:
              output.write(
                  f"tag={selected_tag}\n"
                  f"changed={str(changed).lower()}\n"
                  f"promote={str(promote).lower()}\n"
                  f"release_id={release_id}\n"
              )

          with open(
              e['GITHUB_STEP_SUMMARY'],
              'a'
          ) as summary:

              summary.write(
                  f"Candidate: "
                  f"`{selected_tag}`\n\n"
              )

              if changed:
                  summary.write(
                      "Macmini8,1 build inputs changed: "
                      "build required.\n"
                  )

              elif promote:
                  summary.write(
                      "Identical validated kernel already "
                      "exists. It will be promoted/repaired "
                      "as the stable Latest release without "
                      "recompilation.\n"
                  )

              else:
                  summary.write(
                      "Exact validated Macmini8,1 kernel "
                      "already exists and is the stable "
                      "Latest release: compilation skipped.\n"
                  )
          PY

      - name: Test T2 patch application
        if: steps.candidate.outputs.changed == 'true'
        id: compat
        shell: bash
        env:
          PVE_SHA: ${{ steps.pve.outputs.sha }}
          T2_SHA: ${{ steps.t2.outputs.sha }}
          EXPECTED_PATCHSET_SHA: ${{ steps.t2.outputs.patchset_sha }}
        run: |
          bash scripts/validate-patches.sh

      - name: Prepare T2 build tree for Macmini8,1
        if: steps.candidate.outputs.changed == 'true'
        id: integrate
        shell: bash
        env:
          PVE_SHA: ${{ steps.pve.outputs.sha }}
          T2_SHA: ${{ steps.t2.outputs.sha }}
          EXPECTED_PATCH_COUNT: ${{ steps.compat.outputs.patch_count }}
          EXPECTED_PATCHSET_SHA: ${{ steps.t2.outputs.patchset_sha }}
        run: |
          bash scripts/prepare-integration.sh

      - name: Build Macmini8,1 T2 kernel
        if: steps.candidate.outputs.changed == 'true'
        id: build
        shell: bash
        run: |
          set -euo pipefail

          PVE_DIR="proxmox-pve-kernel"
          KERNEL_VERSION="${{ steps.pve_repo.outputs.kernel }}"

          echo "Starting T2 kernel build"
          echo "Target:  Macmini8,1"
          echo "Kernel:  ${KERNEL_VERSION}-pve-t2"

          echo "Disk space before cleanup:"
          df -h /

          sudo rm -rf \
            /usr/local/lib/android \
            /usr/share/dotnet \
            /opt/ghc \
            /usr/local/.ghcup \
            2>/dev/null || true

          docker image prune -af \
            >/dev/null 2>&1 || true

          echo "Disk space after cleanup:"
          df -h /

          git -C "${PVE_DIR}" config \
            submodule.submodules/ubuntu-kernel.url \
            https://git.proxmox.com/git/mirror_ubuntu-kernels.git

          git -C "${PVE_DIR}" config \
            submodule.submodules/zfsonlinux.url \
            https://git.proxmox.com/git/zfsonlinux.git

          DOCKER_IMAGE="debian:trixie@sha256:f324c7ff54321e8d9c588493a20244965938ce0aa50bbd1022d38010e9ffc4b1"

          docker run \
            --rm \
            -v "${PWD}:/workspace" \
            -w "/workspace/${PVE_DIR}" \
            "${DOCKER_IMAGE}" \
            bash -lc '
              set -euo pipefail

              export DEBIAN_FRONTEND=noninteractive

              echo "Installing Debian prerequisites..."

              apt-get update -qq

              apt-get install -y -qq \
                --no-install-recommends \
                ca-certificates \
                curl \
                >/dev/null

              curl \
                --fail \
                --location \
                --silent \
                --show-error \
                https://enterprise.proxmox.com/debian/proxmox-archive-keyring-trixie.gpg \
                -o /usr/share/keyrings/proxmox-archive-keyring.gpg

              cat > /etc/apt/sources.list.d/proxmox.sources <<EOF_APT
          Types: deb
          URIs: http://download.proxmox.com/debian/pve
          Suites: trixie
          Components: pve-no-subscription
          Signed-By: /usr/share/keyrings/proxmox-archive-keyring.gpg
          EOF_APT

              apt-get update -qq

              echo "Installing Proxmox kernel build dependencies..."

              apt-get install -y -qq \
                --no-install-recommends \
                asciidoc-base \
                automake \
                bc \
                bindgen \
                bison \
                build-essential \
                cpio \
                debhelper \
                dh-python \
                dpkg-dev \
                dwarves \
                fakeroot \
                file \
                flex \
                gawk \
                gcc \
                git \
                kmod \
                libdw-dev \
                libelf-dev \
                libiberty-dev \
                libnuma-dev \
                libpve-common-perl \
                libslang2-dev \
                libssl-dev \
                libtool \
                lintian \
                lz4 \
                perl-modules \
                python3-dev \
                python3-minimal \
                rsync \
                rust-clippy \
                rust-src \
                rustc \
                rustfmt \
                sphinx-common \
                xmlto \
                zlib1g-dev \
                zstd \
                >/dev/null

              git config \
                --global \
                --add safe.directory \
                /workspace/proxmox-pve-kernel

              KERNEL_MAJ="$(
                sed -n "s/^KERNEL_MAJ=//p" Makefile |
                xargs
              )"

              KERNEL_MIN="$(
                sed -n "s/^KERNEL_MIN=//p" Makefile |
                xargs
              )"

              KERNEL_PATCHLEVEL="$(
                sed -n "s/^KERNEL_PATCHLEVEL=//p" Makefile |
                xargs
              )"

              if [[ ! "${KERNEL_MAJ}" =~ ^[0-9]+$ ]] ||
                 [[ ! "${KERNEL_MIN}" =~ ^[0-9]+$ ]] ||
                 [[ ! "${KERNEL_PATCHLEVEL}" =~ ^[0-9]+$ ]]
              then
                echo "ERROR: unable to determine Proxmox kernel base version"
                exit 1
              fi

              KERNEL_BASE="${KERNEL_MAJ}.${KERNEL_MIN}.${KERNEL_PATCHLEVEL}"

              BUILD_KERNEL_DIR="/workspace/proxmox-pve-kernel/proxmox-kernel-${KERNEL_BASE}/ubuntu-kernel"

              echo "Kernel base: ${KERNEL_BASE}"
              echo "Allowing Proxmox build kernel directory:"
              echo "${BUILD_KERNEL_DIR}"

              git config \
                --global \
                --add safe.directory \
                "${BUILD_KERNEL_DIR}"

              echo "Initializing exact Proxmox submodules..."

              git submodule update \
                --init \
                --depth 1 \
                submodules/ubuntu-kernel

              git submodule update \
                --init \
                --recursive \
                submodules/zfsonlinux

              echo
              echo "Building kernel..."
              echo

              make deb
            '

      - name: Validate generated T2 packages
        if: steps.candidate.outputs.changed == 'true'
        id: packages
        shell: bash
        env:
          PVE_DIR: proxmox-pve-kernel
          KERNEL_VERSION: ${{ steps.pve_repo.outputs.kernel }}
        run: |
          bash scripts/validate-packages.sh

      - name: Upload T2 kernel artifacts
        if: steps.candidate.outputs.changed == 'true'
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pve-t2-${{ steps.pve_repo.outputs.kernel }}-macmini8-1
          path: |
            proxmox-pve-kernel/proxmox-kernel-*-pve-t2_*.deb
            proxmox-pve-kernel/proxmox-headers-*-pve-t2_*.deb
            proxmox-pve-kernel/SHA256SUMS
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Write build summary
        if: always() && steps.pve.outputs.status == 'resolved'
        shell: bash
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF_SUMMARY'
          # T2 kernel workflow

          ## Target
          - Hardware: `Macmini8,1`
          - Profile: `AppleSMC / thermal sensors / fan support only`

          ## Published Proxmox kernel
          - Repository: `pve-no-subscription`
          - Package: `${{ steps.pve_repo.outputs.package }}`
          - Kernel: `${{ steps.pve_repo.outputs.kernel }}`
          - Package version: `${{ steps.pve_repo.outputs.version }}`

          ## Proxmox source
          - Status: `${{ steps.pve.outputs.status }}`
          - Repository: `${{ steps.pve.outputs.repository }}`
          - SHA: `${{ steps.pve.outputs.sha }}`
          - Commit: `${{ steps.pve.outputs.subject }}`
          - Debian changelog: `${{ steps.pve.outputs.changelog }}`

          ## T2 source
          - Source SHA: `${{ steps.t2.outputs.sha }}`
          - Kernel target: `${{ steps.t2.outputs.kver }}`
          - Commit: `${{ steps.t2.outputs.subject }}`
          - Macmini8,1 patchset SHA256: `${{ steps.t2.outputs.patchset_sha }}`
          - Allowlisted patches: `${{ steps.t2.outputs.profile_patch_count }}`
          - Potential new patches requiring review: `${{ steps.t2.outputs.review_count }}`
          - Review candidates: `${{ steps.t2.outputs.review_patches }}`

          ## Compatibility
          - Baseline compatible: `${{ steps.compat.outputs.compatible }}`
          - T2 patches applied: `${{ steps.compat.outputs.patch_count }}`
          - T2 patches skipped: `${{ steps.compat.outputs.skipped_count }}`
          - Failed patch: `${{ steps.compat.outputs.failed_patch }}`

          ## Result
          - Build required: `${{ steps.candidate.outputs.changed }}`
          - Existing release promotion/repair: `${{ steps.candidate.outputs.promote }}`
          - Kernel build: `${{ steps.build.outcome }}`
          - Package validation: `${{ steps.packages.outcome }}`
          - Artifact upload: `${{ steps.upload.outcome }}`
          EOF_SUMMARY

  promote:
    name: Promote existing validated release
    needs: discover
    if: needs.discover.outputs.promote == 'true'
    runs-on: ubuntu-latest

    permissions:
      contents: write

    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_ID: ${{ needs.discover.outputs.release_id }}
      RELEASE_TAG: ${{ needs.discover.outputs.tag }}

    steps:
      - name: Promote release to stable Latest
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${RELEASE_ID}" ]]; then
            echo "ERROR: release ID is empty"
            exit 1
          fi

          echo "Promoting/repairing existing validated release:"
          echo "Tag: ${RELEASE_TAG}"
          echo "ID:  ${RELEASE_ID}"

          gh api \
            --method PATCH \
            "repos/${GH_REPO}/releases/${RELEASE_ID}" \
            -F draft=false \
            -F prerelease=false \
            -f make_latest=true \
            > promoted-release.json

          if [[ "$(
            jq -r '.draft' \
              promoted-release.json
          )" != false ]]
          then
            echo "ERROR: release is still a draft"
            exit 1
          fi

          if [[ "$(
            jq -r '.prerelease' \
              promoted-release.json
          )" != false ]]
          then
            echo "ERROR: release is still marked as prerelease"
            exit 1
          fi

          LATEST_ID="$(
            gh api \
              "repos/${GH_REPO}/releases/latest" \
              --jq '.id'
          )"

          if [[ "${LATEST_ID}" != "${RELEASE_ID}" ]]; then
            echo "ERROR: promoted release was not marked as Latest"
            echo "Expected ID: ${RELEASE_ID}"
            echo "Latest ID:   ${LATEST_ID}"
            exit 1
          fi

          printf \
            'Promoted stable Latest release: https://github.com/%s/releases/tag/%s\n' \
            "${GH_REPO}" \
            "${RELEASE_TAG}" \
            >> "${GITHUB_STEP_SUMMARY}"

  publish:
    name: Publish validated kernel release
    needs: discover
    if: needs.discover.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: write
      actions: read

    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ needs.discover.outputs.tag }}
      KERNEL_VERSION: ${{ needs.discover.outputs.kernel }}
      PVE_SHA: ${{ needs.discover.outputs.pve_sha }}
      T2_SHA: ${{ needs.discover.outputs.t2_sha }}
      T2_PATCHSET_SHA: ${{ needs.discover.outputs.t2_patchset_sha }}

    steps:
      - name: Download validated packages from this run
        shell: bash
        run: |
          set -euo pipefail

          gh run download "$GITHUB_RUN_ID" \
            --name "pve-t2-${KERNEL_VERSION}-macmini8-1" \
            --dir release-assets

      - name: Verify packages and prepare portable checksums
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import hashlib
          import os
          import pathlib
          import re
          import subprocess

          root = pathlib.Path(
              'release-assets'
          )

          files = list(
              root.iterdir()
          )

          assert (
              len(files) == 3
              and all(
                  p.is_file()
                  for p in files
              )
          ), 'Expected exactly three files'

          kernel = list(
              root.glob(
                  'proxmox-kernel-*-pve-t2_*.deb'
              )
          )

          headers = list(
              root.glob(
                  'proxmox-headers-*-pve-t2_*.deb'
              )
          )

          assert (
              len(kernel) == 1
              and len(headers) == 1
          ), 'Expected kernel and headers'

          packages = (
              kernel
              + headers
          )

          sums = (
              root
              / 'SHA256SUMS'
          )

          expected = {}

          for line in sums.read_text().splitlines():
              digest, name = line.split(
                  maxsplit=1
              )

              name = pathlib.PurePosixPath(
                  name
              ).name

              assert (
                  re.fullmatch(
                      r'[0-9a-f]{64}',
                      digest
                  )
                  and
                  name not in expected
              )

              expected[name] = digest

          assert (
              set(expected)
              ==
              {
                  p.name
                  for p in packages
              }
          ), 'Invalid checksum coverage'

          versions = []

          for p, prefix in zip(
              packages,
              [
                  'proxmox-kernel-',
                  'proxmox-headers-'
              ]
          ):

              actual_digest = hashlib.sha256(
                  p.read_bytes()
              ).hexdigest()

              assert (
                  actual_digest
                  ==
                  expected[p.name]
              ), 'Checksum mismatch'

              name, version, arch = (
                  subprocess.check_output(
                      [
                          'dpkg-deb',
                          '-W',
                          '--showformat=${Package}\t${Version}\t${Architecture}',
                          str(p)
                      ],
                      text=True
                  ).split('\t')
              )

              assert (
                  name
                  ==
                  prefix
                  + os.environ[
                      'KERNEL_VERSION'
                  ]
                  + '-pve-t2'
              )

              assert arch == 'amd64'

              versions.append(
                  version
              )

          assert (
              versions[0]
              ==
              versions[1]
          ), 'Kernel/header version mismatch'

          sums.write_text(
              ''.join(
                  f"{expected[p.name]}  "
                  f"{p.name}\n"
                  for p in packages
              )
          )

          e = os.environ

          pathlib.Path(
              'release-notes.md'
          ).write_text(
              f"Proxmox kernel "
              f"{e['KERNEL_VERSION']}-pve-t2 "
              f"for Macmini8,1\n\n"

              "Automatically compiled and package-validated. "
              "Hardware boot, thermal sensors and fan operation "
              "have NOT been validated by this workflow.\n\n"

              "Profile: AppleSMC / thermal sensors / fan support only; "
              "not the complete T2 patchset.\n\n"

              f"Proxmox source: "
              f"{e['PVE_SHA']}\n\n"

              f"T2 source revision: "
              f"{e['T2_SHA']}\n\n"

              f"Macmini8,1 T2 patchset SHA256: "
              f"{e['T2_PATCHSET_SHA']}\n\n"

              f"Build recipe commit: "
              f"{e['GITHUB_SHA']}\n\n"

              f"Build: "
              f"https://github.com/"
              f"{e['GITHUB_REPOSITORY']}"
              f"/actions/runs/"
              f"{e['GITHUB_RUN_ID']}\n\n"

              "Assets: kernel, matching headers and SHA256SUMS. "
              "Verify with `sha256sum -c SHA256SUMS`. "
              "Keep a working kernel for rollback.\n"
          )
          PY

      - name: Stage assets then publish release
        shell: bash
        run: |
          set -euo pipefail

          STATUS="$(
            curl \
              --silent \
              --show-error \
              --output release.json \
              --write-out '%{http_code}' \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'Accept: application/vnd.github+json' \
              "https://api.github.com/repos/${GH_REPO}/releases/tags/${RELEASE_TAG}"
          )"

          case "${STATUS}" in

            200)
              if [[ "$(
                jq -r '.draft' \
                  release.json
              )" != true ]]
              then
                echo "This release is already published; keeping existing assets."
                exit 0
              fi
              ;;

            404)
              #
              # Create a normal release as a draft.
              # It is intentionally NOT marked as prerelease.
              #
              gh release create \
                "${RELEASE_TAG}" \
                --draft \
                --latest=false \
                --target "${GITHUB_SHA}" \
                --title "Proxmox ${KERNEL_VERSION} T2 — Macmini8,1" \
                --notes-file release-notes.md
              ;;

            *)
              echo "ERROR: release lookup returned HTTP ${STATUS}"
              exit 1
              ;;

          esac

          gh release upload \
            "${RELEASE_TAG}" \
            release-assets/* \
            --clobber

          #
          # Publish the validated draft as a normal release
          # and explicitly make it GitHub Latest.
          #

          gh release edit \
            "${RELEASE_TAG}" \
            --draft=false \
            --latest \
            --notes-file release-notes.md

          #
          # Verify that GitHub really exposes this release
          # as Latest.
          #

          RELEASE_ID="$(
            gh api \
              "repos/${GH_REPO}/releases/tags/${RELEASE_TAG}" \
              --jq '.id'
          )"

          LATEST_ID="$(
            gh api \
              "repos/${GH_REPO}/releases/latest" \
              --jq '.id'
          )"

          if [[ "${RELEASE_ID}" != "${LATEST_ID}" ]]; then
            echo "ERROR: published release is not GitHub Latest"
            echo "Published ID: ${RELEASE_ID}"
            echo "Latest ID:    ${LATEST_ID}"
            exit 1
          fi

          printf \
            'Published stable Latest release: https://github.com/%s/releases/tag/%s\n' \
            "${GH_REPO}" \
            "${RELEASE_TAG}" \
            >> "${GITHUB_STEP_SUMMARY}"