name: Build T2 kernel

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

concurrency:
  group: t2-kernel-build-and-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  discover:
    name: Discover, validate and build changed upstream revisions
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 180

    outputs:
      changed: ${{ steps.compat.outputs.compatible == 'true' && steps.candidate.outputs.changed == 'true' && 'true' || 'false' }}
      promote: ${{ steps.compat.outputs.compatible == 'true' && steps.candidate.outputs.promote == 'true' && 'true' || 'false' }}
      release_id: ${{ steps.candidate.outputs.release_id }}
      tag: ${{ steps.candidate.outputs.tag }}
      kernel: ${{ steps.pve_repo.outputs.kernel }}
      pve_sha: ${{ steps.pve.outputs.sha }}
      t2_sha: ${{ steps.t2.outputs.sha }}
      t2_upstream_patchset_sha: ${{ steps.t2.outputs.patchset_sha }}
      t2_patchset_sha: ${{ steps.compat.outputs.patchset_sha }}
      compat_overrides: ${{ steps.compat.outputs.compat_overrides }}
      source_status: ${{ steps.pve.outputs.status }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Discover latest published Proxmox kernel
        id: pve_repo
        shell: bash
        run: |
          bash scripts/discover-proxmox.sh

      - name: Resolve published Proxmox source commit
        id: pve
        shell: bash
        env:
          PUBLISHED_KERNEL: ${{ steps.pve_repo.outputs.kernel }}
          PUBLISHED_VERSION: ${{ steps.pve_repo.outputs.version }}
        run: |
          bash scripts/resolve-proxmox.sh

      - name: Wait for Proxmox source
        if: steps.pve.outputs.status == 'pending'
        shell: bash
        env:
          PACKAGE_VERSION: ${{ steps.pve_repo.outputs.version }}
        run: |
          echo "::notice title=Waiting for Proxmox source::${PACKAGE_VERSION} is published in APT, but the matching Git source is not available yet. No build or release will be performed; the scheduled workflow will retry."

      - name: Resolve Macmini8,1 T2 patch candidate
        if: steps.pve.outputs.status == 'resolved'
        id: t2
        shell: bash
        env:
          PVE_KERNEL: ${{ steps.pve_repo.outputs.kernel }}
        run: |
          bash scripts/resolve-t2.sh

      - name: Validate T2 patch compatibility
        if: steps.pve.outputs.status == 'resolved'
        id: compat
        shell: bash
        env:
          PVE_SHA: ${{ steps.pve.outputs.sha }}
          T2_SHA: ${{ steps.t2.outputs.sha }}
          EXPECTED_PATCHSET_SHA: ${{ steps.t2.outputs.patchset_sha }}
        run: |
          bash scripts/validate-patches.sh

      - name: Validate T2 integration inputs
        if: steps.pve.outputs.status == 'resolved'
        id: config
        shell: bash
        run: |
          bash scripts/validate-config.sh

      - name: Wait for T2 compatibility
        if: steps.pve.outputs.status == 'resolved' && steps.compat.outputs.compatible == 'false'
        shell: bash
        run: |
          echo "::notice title=Waiting for T2 compatibility::Proxmox ${{ steps.pve_repo.outputs.kernel }} is not compatible with the reviewed Macmini8,1 patch profile. Failed patch: ${{ steps.compat.outputs.failed_patch }}. No build or release will be performed; the scheduled workflow will retry."

      - name: Check whether this exact Macmini8,1 build is already published
        if: steps.pve.outputs.status == 'resolved' && steps.compat.outputs.compatible == 'true'
        id: candidate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PVE_SHA: ${{ steps.pve.outputs.sha }}
          T2_PATCHSET_SHA: ${{ steps.compat.outputs.patchset_sha }}
          KERNEL_VERSION: ${{ steps.pve_repo.outputs.kernel }}
          PACKAGE_VERSION: ${{ steps.pve_repo.outputs.version }}
        run: |
          set -euo pipefail

          RECIPE="$(
            git rev-parse \
              HEAD:scripts \
              HEAD:.github/workflows/build.yml
          )"

          IDENTITY="$(
            printf '%s\n%s\n%s\n%s\n' \
              "${PVE_SHA}" \
              "${T2_PATCHSET_SHA}" \
              "${PACKAGE_VERSION}" \
              "${RECIPE}"
          )"

          DIGEST="$(
            printf '%s' "${IDENTITY}" |
              sha256sum |
              awk '{print $1}'
          )"

          TAG="auto-${KERNEL_VERSION}-pve-t2-${DIGEST}"

          STATUS="$(
            curl \
              --silent \
              --show-error \
              --output release.json \
              --write-out '%{http_code}' \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${GH_REPO}/releases/tags/${TAG}"
          )"

          CHANGED=false
          PROMOTE=false
          RELEASE_ID=""

          case "${STATUS}" in
            200)
              RELEASE_ID="$(jq -r '.id' release.json)"

              if [[ "$(jq -r '.draft' release.json)" == true ]]; then
                CHANGED=true
              elif [[ "$(jq -r '.prerelease' release.json)" == true ]]; then
                PROMOTE=true
              else
                LATEST_ID="$(
                  gh api \
                    "repos/${GH_REPO}/releases/latest" \
                    --jq '.id' \
                    2>/dev/null || true
                )"

                if [[ "${LATEST_ID}" != "${RELEASE_ID}" ]]; then
                  PROMOTE=true
                fi
              fi
              ;;

            404)
              CHANGED=true
              ;;

            *)
              echo "ERROR: release lookup returned HTTP ${STATUS}"
              exit 1
              ;;
          esac

          {
            echo "tag=${TAG}"
            echo "changed=${CHANGED}"
            echo "promote=${PROMOTE}"
            echo "release_id=${RELEASE_ID}"
          } >> "${GITHUB_OUTPUT}"

          {
            echo
            echo "## Release candidate"
            echo "- Tag: \`${TAG}\`"
            echo "- Build required: \`${CHANGED}\`"
            echo "- Promotion/Latest repair required: \`${PROMOTE}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Prepare T2 build tree for Macmini8,1
        if: steps.compat.outputs.compatible == 'true' && steps.candidate.outputs.changed == 'true'
        id: integrate
        shell: bash
        env:
          PVE_SHA: ${{ steps.pve.outputs.sha }}
          T2_SHA: ${{ steps.t2.outputs.sha }}
          EXPECTED_PATCH_COUNT: ${{ steps.compat.outputs.patch_count }}
          EXPECTED_PATCHSET_SHA: ${{ steps.compat.outputs.patchset_sha }}
        run: |
          bash scripts/prepare-integration.sh

      - name: Build Macmini8,1 T2 kernel
        if: steps.compat.outputs.compatible == 'true' && steps.candidate.outputs.changed == 'true'
        id: build
        shell: bash
        run: |
          set -euo pipefail

          PVE_DIR="proxmox-pve-kernel"
          KERNEL_VERSION="${{ steps.pve_repo.outputs.kernel }}"

          echo "Starting T2 kernel build"
          echo "Target:  Macmini8,1"
          echo "Kernel:  ${KERNEL_VERSION}-pve-t2"

          echo "Disk space before cleanup:"
          df -h /

          sudo rm -rf \
            /usr/local/lib/android \
            /usr/share/dotnet \
            /opt/ghc \
            /usr/local/.ghcup \
            2>/dev/null || true

          docker image prune -af \
            >/dev/null 2>&1 || true

          echo "Disk space after cleanup:"
          df -h /

          git -C "${PVE_DIR}" config \
            submodule.submodules/ubuntu-kernel.url \
            https://git.proxmox.com/git/mirror_ubuntu-kernels.git

          git -C "${PVE_DIR}" config \
            submodule.submodules/zfsonlinux.url \
            https://git.proxmox.com/git/zfsonlinux.git

          DOCKER_IMAGE="debian:trixie@sha256:f324c7ff54321e8d9c588493a20244965938ce0aa50bbd1022d38010e9ffc4b1"

          docker run \
            --rm \
            -v "${PWD}:/workspace" \
            -w "/workspace/${PVE_DIR}" \
            "${DOCKER_IMAGE}" \
            bash -lc '
              set -euo pipefail

              export DEBIAN_FRONTEND=noninteractive

              echo "Installing Debian prerequisites..."

              apt-get update -qq

              apt-get install -y -qq \
                --no-install-recommends \
                ca-certificates \
                curl \
                >/dev/null

              curl \
                --fail \
                --location \
                --silent \
                --show-error \
                https://enterprise.proxmox.com/debian/proxmox-archive-keyring-trixie.gpg \
                -o /usr/share/keyrings/proxmox-archive-keyring.gpg

              cat > /etc/apt/sources.list.d/proxmox.sources <<EOF_APT
          Types: deb
          URIs: http://download.proxmox.com/debian/pve
          Suites: trixie
          Components: pve-no-subscription
          Signed-By: /usr/share/keyrings/proxmox-archive-keyring.gpg
          EOF_APT

              apt-get update -qq

              echo "Installing Proxmox kernel build dependencies..."

              apt-get install -y -qq \
                --no-install-recommends \
                asciidoc-base \
                automake \
                bc \
                bindgen \
                bison \
                build-essential \
                cpio \
                debhelper \
                dh-python \
                dpkg-dev \
                dwarves \
                fakeroot \
                file \
                flex \
                gawk \
                gcc \
                git \
                kmod \
                libdw-dev \
                libelf-dev \
                libiberty-dev \
                libnuma-dev \
                libpve-common-perl \
                libslang2-dev \
                libssl-dev \
                libtool \
                lintian \
                lz4 \
                perl-modules \
                python3-dev \
                python3-minimal \
                rsync \
                rust-clippy \
                rust-src \
                rustc \
                rustfmt \
                sphinx-common \
                xmlto \
                zlib1g-dev \
                zstd \
                >/dev/null

              git config \
                --global \
                --add safe.directory \
                /workspace/proxmox-pve-kernel

              KERNEL_MAJ="$(
                sed -n "s/^KERNEL_MAJ=//p" Makefile |
                xargs
              )"

              KERNEL_MIN="$(
                sed -n "s/^KERNEL_MIN=//p" Makefile |
                xargs
              )"

              KERNEL_PATCHLEVEL="$(
                sed -n "s/^KERNEL_PATCHLEVEL=//p" Makefile |
                xargs
              )"

              if [[ ! "${KERNEL_MAJ}" =~ ^[0-9]+$ ]] ||
                 [[ ! "${KERNEL_MIN}" =~ ^[0-9]+$ ]] ||
                 [[ ! "${KERNEL_PATCHLEVEL}" =~ ^[0-9]+$ ]]
              then
                echo "ERROR: unable to determine Proxmox kernel base version"
                exit 1
              fi

              KERNEL_BASE="${KERNEL_MAJ}.${KERNEL_MIN}.${KERNEL_PATCHLEVEL}"

              BUILD_KERNEL_DIR="/workspace/proxmox-pve-kernel/proxmox-kernel-${KERNEL_BASE}/ubuntu-kernel"

              echo "Kernel base: ${KERNEL_BASE}"
              echo "Allowing Proxmox build kernel directory:"
              echo "${BUILD_KERNEL_DIR}"

              git config \
                --global \
                --add safe.directory \
                "${BUILD_KERNEL_DIR}"

              echo "Initializing exact Proxmox submodules..."

              git submodule update \
                --init \
                --depth 1 \
                submodules/ubuntu-kernel

              git submodule update \
                --init \
                --recursive \
                submodules/zfsonlinux

              echo
              echo "Building kernel..."
              echo

              make deb
            '

      - name: Validate generated T2 packages
        if: steps.compat.outputs.compatible == 'true' && steps.candidate.outputs.changed == 'true'
        id: packages
        shell: bash
        env:
          PVE_DIR: proxmox-pve-kernel
          KERNEL_VERSION: ${{ steps.pve_repo.outputs.kernel }}
        run: |
          bash scripts/validate-packages.sh

      - name: Upload T2 kernel artifacts
        if: steps.compat.outputs.compatible == 'true' && steps.candidate.outputs.changed == 'true'
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pve-t2-${{ steps.pve_repo.outputs.kernel }}-macmini8-1
          path: |
            proxmox-pve-kernel/proxmox-kernel-*-pve-t2_*.deb
            proxmox-pve-kernel/proxmox-headers-*-pve-t2_*.deb
            proxmox-pve-kernel/SHA256SUMS
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Write build summary
        if: always()
        shell: bash
        run: |
          if [[ "${{ steps.pve.outputs.status }}" == "pending" ]]; then
            STATE="WAITING_FOR_PROXMOX_SOURCE"
          elif [[ "${{ steps.compat.outputs.compatible }}" == "false" ]]; then
            STATE="WAITING_FOR_COMPATIBILITY"
          elif [[ "${{ steps.candidate.outputs.changed }}" == "true" ]]; then
            STATE="BUILD_REQUIRED"
          elif [[ "${{ steps.candidate.outputs.promote }}" == "true" ]]; then
            STATE="PROMOTION_REQUIRED"
          elif [[ "${{ steps.compat.outputs.compatible }}" == "true" ]]; then
            STATE="UP_TO_DATE"
          else
            STATE="UNKNOWN"
          fi

          cat >> "$GITHUB_STEP_SUMMARY" <<EOF_SUMMARY
          # T2 kernel workflow

          ## State
          **${STATE}**

          ## Target
          - Hardware: \`Macmini8,1\`
          - Profile: \`AppleSMC / thermal sensors / fan support only\`

          ## Published Proxmox kernel
          - Package: \`${{ steps.pve_repo.outputs.package }}\`
          - Kernel: \`${{ steps.pve_repo.outputs.kernel }}\`
          - Package version: \`${{ steps.pve_repo.outputs.version }}\`

          ## Proxmox source
          - Status: \`${{ steps.pve.outputs.status }}\`
          - SHA: \`${{ steps.pve.outputs.sha }}\`
          - Commit: \`${{ steps.pve.outputs.subject }}\`

          ## T2 source
          - Source SHA: \`${{ steps.t2.outputs.sha }}\`
          - Kernel target: \`${{ steps.t2.outputs.kver }}\`
          - Upstream patchset SHA256: \`${{ steps.t2.outputs.patchset_sha }}\`

          ## Compatibility
          - Compatible: \`${{ steps.compat.outputs.compatible }}\`
          - Failed patch: \`${{ steps.compat.outputs.failed_patch }}\`
          - Reviewed compatibility replacements: \`${{ steps.compat.outputs.compat_overrides }}\`
          - Effective patchset SHA256: \`${{ steps.compat.outputs.patchset_sha }}\`

          ## Result
          - Build required: \`${{ steps.candidate.outputs.changed }}\`
          - Kernel build: \`${{ steps.build.outcome }}\`
          - Package validation: \`${{ steps.packages.outcome }}\`
          - Artifact upload: \`${{ steps.upload.outcome }}\`
          EOF_SUMMARY

  promote:
    name: Promote existing validated release
    needs: discover
    if: needs.discover.outputs.promote == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: write

    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_ID: ${{ needs.discover.outputs.release_id }}
      RELEASE_TAG: ${{ needs.discover.outputs.tag }}

    steps:
      - name: Promote release to stable Latest
        shell: bash
        run: |
          set -euo pipefail

          [[ -n "${RELEASE_ID}" ]] || {
            echo "ERROR: release ID is empty"
            exit 1
          }

          gh api \
            --method PATCH \
            "repos/${GH_REPO}/releases/${RELEASE_ID}" \
            -F draft=false \
            -F prerelease=false \
            -f make_latest=true \
            > promoted-release.json

          [[ "$(jq -r '.draft' promoted-release.json)" == false ]]
          [[ "$(jq -r '.prerelease' promoted-release.json)" == false ]]

          LATEST_ID="$(
            gh api \
              "repos/${GH_REPO}/releases/latest" \
              --jq '.id'
          )"

          [[ "${LATEST_ID}" == "${RELEASE_ID}" ]] || {
            echo "ERROR: promoted release was not marked as Latest"
            exit 1
          }

  publish:
    name: Publish validated kernel release
    needs: discover
    if: needs.discover.outputs.changed == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: write
      actions: read

    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ needs.discover.outputs.tag }}
      KERNEL_VERSION: ${{ needs.discover.outputs.kernel }}
      PVE_SHA: ${{ needs.discover.outputs.pve_sha }}
      T2_SHA: ${{ needs.discover.outputs.t2_sha }}
      T2_UPSTREAM_PATCHSET_SHA: ${{ needs.discover.outputs.t2_upstream_patchset_sha }}
      T2_PATCHSET_SHA: ${{ needs.discover.outputs.t2_patchset_sha }}
      T2_COMPAT_OVERRIDES: ${{ needs.discover.outputs.compat_overrides }}

    steps:
      - name: Download validated packages from this run
        shell: bash
        run: |
          set -euo pipefail

          gh run download "$GITHUB_RUN_ID" \
            --name "pve-t2-${KERNEL_VERSION}-macmini8-1" \
            --dir release-assets

      - name: Verify packages and prepare release notes
        shell: bash
        run: |
          set -euo pipefail

          cd release-assets

          mapfile -t DEBS < <(
            find . -maxdepth 1 -type f -name '*.deb' -printf '%f\n' | sort
          )

          [[ "${#DEBS[@]}" -eq 2 ]] || {
            echo "ERROR: expected exactly kernel and headers packages"
            exit 1
          }

          sed -i 's#  proxmox-pve-kernel/#  #' SHA256SUMS
          sha256sum -c SHA256SUMS

          for DEB in "${DEBS[@]}"; do
            dpkg-deb -W \
              --showformat='${Package}\t${Version}\t${Architecture}\n' \
              "${DEB}"
          done

          cd ..

          cat > release-notes.md <<EOF_NOTES
          Proxmox kernel ${KERNEL_VERSION}-pve-t2 for Macmini8,1

          Automatically compiled and package-validated. Hardware boot, thermal
          sensors and fan operation have NOT been validated by GitHub Actions.

          Profile: AppleSMC / thermal sensors / fan support only; not the
          complete T2 patchset.

          Proxmox source: ${PVE_SHA}

          T2 source revision: ${T2_SHA}

          Upstream Macmini8,1 patchset SHA256: ${T2_UPSTREAM_PATCHSET_SHA}

          Effective Macmini8,1 patchset SHA256: ${T2_PATCHSET_SHA}

          Reviewed compatibility replacements: ${T2_COMPAT_OVERRIDES:-none}

          Build recipe commit: ${GITHUB_SHA}

          Build: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}

          Assets: kernel, matching headers and SHA256SUMS.
          Verify with: sha256sum -c SHA256SUMS
          Keep a working kernel for rollback.
          EOF_NOTES

      - name: Stage assets then publish release
        shell: bash
        run: |
          set -euo pipefail

          STATUS="$(
            curl \
              --silent \
              --show-error \
              --output release.json \
              --write-out '%{http_code}' \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'Accept: application/vnd.github+json' \
              "https://api.github.com/repos/${GH_REPO}/releases/tags/${RELEASE_TAG}"
          )"

          case "${STATUS}" in
            200)
              if [[ "$(jq -r '.draft' release.json)" != true ]]; then
                echo "Release already published; keeping existing assets."
                exit 0
              fi
              ;;

            404)
              gh release create \
                "${RELEASE_TAG}" \
                --draft \
                --latest=false \
                --target "${GITHUB_SHA}" \
                --title "Proxmox ${KERNEL_VERSION} T2 — Macmini8,1" \
                --notes-file release-notes.md
              ;;

            *)
              echo "ERROR: release lookup returned HTTP ${STATUS}"
              exit 1
              ;;
          esac

          gh release upload \
            "${RELEASE_TAG}" \
            release-assets/* \
            --clobber

          gh release edit \
            "${RELEASE_TAG}" \
            --draft=false \
            --latest \
            --notes-file release-notes.md

          RELEASE_ID="$(
            gh api \
              "repos/${GH_REPO}/releases/tags/${RELEASE_TAG}" \
              --jq '.id'
          )"

          LATEST_ID="$(
            gh api \
              "repos/${GH_REPO}/releases/latest" \
              --jq '.id'
          )"

          [[ "${RELEASE_ID}" == "${LATEST_ID}" ]] || {
            echo "ERROR: published release is not GitHub Latest"
            exit 1
          }
